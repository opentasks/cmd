name: publish

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [publish-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g., v0.1.0)'
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ github.event.client_payload.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - id: inputs
        uses: simenandre/setup-inputs@00a2f5d3135898b400343ff87d99b7841e6e4592 #v1

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ steps.inputs.outputs.tag || github.ref }}


      - name: Setup environment
        uses: jdx/mise-action@146a28175021df8ca24f8ee1828cc2a60f980bd5 #v3
        with:
          experimental: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a #v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.inputs.outputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
