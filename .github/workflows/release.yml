name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases-created: ${{ steps.release.outputs.releases_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 #v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: go

      - name: Release-Please Debug
        run: |
          echo '${{ toJSON(steps.release.outputs) }}' | jq -r

  dispatch-publish:
    needs: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4
        with:
          fetch-depth: 0  # Full history needed for tag distance calculation

      - name: Calculate prerelease tag
        id: prerelease-tag
        if: needs.release-please.outputs.releases-created != 'true'
        run: |
          # Find the nearest tag matching v*
          LATEST_TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            # No tags exist, use commit count from start
            COMMIT_COUNT=$(git rev-list --count HEAD)
            TAG="v0.0.0-${COMMIT_COUNT}+${GITHUB_SHA:0:7}"
          else
            # Count commits since the latest tag
            COMMIT_DISTANCE=$(git rev-list --count ${LATEST_TAG}..HEAD)
            TAG="${LATEST_TAG}-${COMMIT_DISTANCE}+${GITHUB_SHA:0:7}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Dispatch publish (stable)
        if: needs.release-please.outputs.releases-created == 'true'
        uses: peter-evans/repository-dispatch@bf47d102fdb849e755b0b0023ea3e81a44b6f570 #v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: publish-package
          client-payload: |
            {
              "tag": "${{ needs.release-please.outputs.tag-name }}"
            }

      - name: Dispatch publish (prerelease)
        if: needs.release-please.outputs.releases-created != 'true'
        uses: peter-evans/repository-dispatch@bf47d102fdb849e755b0b0023ea3e81a44b6f570 #v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: publish-package
          client-payload: |
            {
              "tag": "${{ steps.prerelease-tag.outputs.tag }}"
            }
