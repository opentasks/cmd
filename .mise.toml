# OpenTask - mise configuration
# Specifies development environment requirements

[tools]
go = "latest"
# Go version - pinned for consistency
golang = "1.21"

[tasks.build]
description = "Build the OpenTask CLI"
run = "go build -o bin/opentask ./cmd/opentask"

[tasks.install]
description = "Install OpenTask CLI"
depends = ["build"]
run = "cp ./bin/opentask ~/.local/bin/opentask"

[tasks.test]
description = "Run all tests"
run = "go test -v ./..."

[tasks.test-storage]
description = "Run storage package tests"
run = "go test -v ./internal/storage/..."

[tasks.test-model]
description = "Run model package tests"
run = "go test -v ./internal/model/..."

[tasks.test-config]
description = "Run config package tests"
run = "go test -v ./internal/config/..."

[tasks.test-query]
description = "Run query package tests"
run = "go test -v ./internal/query/..."

[tasks.lint]
description = "Run go vet"
run = "go vet ./..."

[tasks.fmt]
description = "Format code with gofmt"
run = "gofmt -w ."

[tasks.clean]
description = "Clean build artifacts"
run = "rm -f opentask ./demo/ && find . -name '*.md' -path './test*' -delete"

[tasks.demo]
description = "Run demo workflow"
run = """
rm -rf ./demo
mkdir -p ./demo
./opentask --path ./demo task new "Design Phase" --type epic
./opentask --path ./demo task new "Plan architecture" --type plan --parent 1
./opentask --path ./demo task new "Research patterns" --type research --parent 1
./opentask --path ./demo task new "Implement core" --type story --parent 1 --tag backend
./opentask --path ./demo task list
echo ""
echo "Demo project created at: ./demo/"
"""

[tasks.help]
description = "Show available mise tasks"
run = "mise tasks"
